server.port=8081
spring.kafka.bootstrap-servers=localhost:9092
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vantagedial}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vantagedial}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:vantagedial}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Producer (CommandMessage -> dialer-commands)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer (StandardEvent <- dialer-events)
spring.kafka.consumer.group-id=dialer-api-events-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.vantage.dialer.common.events,com.vantagedial.common.commands
spring.kafka.consumer.properties.spring.json.value.default.type=com.vantage.dialer.common.events.StandardEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
logging.level.root=${APP_LOG_LEVEL_ROOT:INFO}
logging.level.com.vantage.dialer=${APP_LOG_LEVEL_APP:INFO}
app.logging.level=${APP_LOGGING_LEVEL:MODERATE}
app.exports.directory=${APP_EXPORTS_DIRECTORY:./exports}
app.asterisk.deploy.enabled=${APP_ASTERISK_DEPLOY_ENABLED:false}
app.asterisk.deploy.host=${APP_ASTERISK_DEPLOY_HOST:}
app.asterisk.deploy.port=${APP_ASTERISK_DEPLOY_PORT:22}
app.asterisk.deploy.user=${APP_ASTERISK_DEPLOY_USER:ubuntu}
app.asterisk.deploy.private-key=${APP_ASTERISK_DEPLOY_PRIVATE_KEY:}
app.asterisk.deploy.remote-base-directory=${APP_ASTERISK_DEPLOY_REMOTE_BASE_DIRECTORY:/tmp/vantage-asterisk}
app.asterisk.deploy.target-directory=${APP_ASTERISK_DEPLOY_TARGET_DIRECTORY:/etc/asterisk/generated}
app.asterisk.deploy.strict-host-key-checking=${APP_ASTERISK_DEPLOY_STRICT_HOST_KEY_CHECKING:no}
