server.port=8082

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=dialer-worker-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.vantage.dialer.common.commands,com.vantagedial.common.events
spring.kafka.consumer.properties.spring.json.value.default.type=com.vantage.dialer.common.commands.CommandMessage
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=dialer-worker-v2

asterisk.ami.host=${ASTERISK_AMI_HOST:localhost}
asterisk.ami.port=${ASTERISK_AMI_PORT:5038}
asterisk.ami.username=${ASTERISK_AMI_USERNAME:admin}
asterisk.ami.password=${ASTERISK_AMI_PASSWORD:}
asterisk.ami.endpoint=${ASTERISK_AMI_ENDPOINT:vivphone-endpoint}
asterisk.ami.caller-id=${ASTERISK_AMI_CALLER_ID:Vantage Dialer}
asterisk.ami.dial-prefix=${ASTERISK_AMI_DIAL_PREFIX:91}
asterisk.ami.originate-context=${ASTERISK_AMI_CONTEXT:from-internal}
asterisk.ami.originate-extension=${ASTERISK_AMI_EXTENSION:s}
asterisk.ami.originate-priority=${ASTERISK_AMI_PRIORITY:1}
asterisk.ami.originate-timeout-ms=${ASTERISK_AMI_TIMEOUT_MS:30000}
asterisk.ami.reconnect-delay-ms=${ASTERISK_AMI_RECONNECT_DELAY_MS:10000}
