services:
  postgres:
    image: postgres:16
    container_name: vantagedial-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vantagedial}
      POSTGRES_USER: ${POSTGRES_USER:-vantagedial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vantagedial}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  kafka:
    image: bitnami/kafka:3.9.2
    container_name: vantagedial-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LOG_RETENTION_HOURS: 24
      KAFKA_CFG_LOG_RETENTION_BYTES: 1073741824
      KAFKA_CFG_LOG_SEGMENT_BYTES: 268435456
      KAFKA_KRAFT_CLUSTER_ID: MDEyMzQ1Njc4OTAxMjM0NQ
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/bitnami/kafka

  dialer-api:
    build:
      context: .
      dockerfile: dialer-api/Dockerfile
    container_name: vantagedial-api
    depends_on:
      - postgres
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vantagedial}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vantagedial}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vantagedial}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_LOGGING_LEVEL: ${APP_LOGGING_LEVEL:-MODERATE}
      APP_EXPORTS_DIRECTORY: /app/exports
    ports:
      - "8081:8081"
    volumes:
      - api-exports:/app/exports

  dialer-worker:
    build:
      context: .
      dockerfile: dialer-worker/Dockerfile
    container_name: vantagedial-worker
    depends_on:
      - kafka
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ASTERISK_AMI_HOST: ${ASTERISK_AMI_HOST}
      ASTERISK_AMI_PORT: ${ASTERISK_AMI_PORT:-5038}
      ASTERISK_AMI_USERNAME: ${ASTERISK_AMI_USERNAME}
      ASTERISK_AMI_PASSWORD: ${ASTERISK_AMI_PASSWORD}
      ASTERISK_AMI_ENDPOINT: ${ASTERISK_AMI_ENDPOINT}
      ASTERISK_AMI_DIAL_PREFIX: ${ASTERISK_AMI_DIAL_PREFIX:-91}
      ASTERISK_AMI_CONTEXT: ${ASTERISK_AMI_CONTEXT:-from-internal}
      ASTERISK_AMI_EXTENSION: ${ASTERISK_AMI_EXTENSION:-1001}
      ASTERISK_AMI_PRIORITY: ${ASTERISK_AMI_PRIORITY:-1}
      WORKER_APP_LOGGING_LEVEL: ${WORKER_APP_LOGGING_LEVEL:-MODERATE}
    ports:
      - "8082:8082"

volumes:
  postgres-data:
  kafka-data:
  api-exports:
