name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run API reactor tests
        run: mvn -pl dialer-api -am test

      - name: Run worker reactor tests
        run: mvn -pl dialer-worker -am test

  softphone_ui:
    name: Softphone UI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dialer-softphone-ui

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dialer-softphone-ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Run UI tests
        run: npm test

      - name: Build UI
        run: npm run build
